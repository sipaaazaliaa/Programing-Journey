<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktik Border 1</title>
    <style>
        .solid {
            border: 3px solid blue;
            padding: 10px;
            background-color: blueviolet;
        }
        .dotted {
            border: 3px dotted red;
            padding: 10px;
            background-color: palevioletred;
        }
        .double {
            border: 5px double green;
            padding: 10px;
            background-color: aquamarine;
        }
        .dashed {
            border: 3px dashed rgb(103, 103, 180);
            padding: 10px;
            background-color: rgb(142, 162, 200);
        }
        .groove {
            border: 3px groove rgb(223, 255, 118);
            padding: 10px;
            background-color: rgb(225, 230, 181);
        }
        .ridge {
            border: 3px ridge rgb(45, 44, 44);
            padding: 10px;
            border-color: gray;
        }

    </style>
</head>
<body>
    <p class="solid"> Ini border solid </p>
    <p class="dotted"> Ini border dotted </p>
    <p class="double"> Ini border double </p>
    <p class="dashed"> Ini border dashed </p>
    <p class="groove"> Ini border groove </p>
    <p class="ridge"> Ini border ridge </p>
</body>
</html>
