<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1</title>
    <style>
        .box1 {
            width: 200px;
            height: 200px;
            background-color: coral;
        }
        .box2 {
            width: 50px;
            height: 150px;
            background-color: rgb(211, 88, 43);
        }
        .box3 {
            width: 80vw;
            height: 30vh;
            background-color: rgb(86, 23, 0);
        }
    </style>
</head>
<body>
    <div class="box1">
        200px X 200px
    </div>
    <div class="box2">
        50% X 150px
    </div>
    <div class="box3">
        80vw X 30vh
    </div>
</body>
</html>
