<html lang="en">
<head>

    <style>
        .Header {

            height: 100px;
            background-color: rgb(238, 204, 228);

            font-style: italic;
            text-align: center;
        }
        .Content {
            width: 100%;
            height: 300px;

            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-style: oblique;
            text-align: center;
        }
        .Footer {
            width: 100%;
            height: 30px;
            background-color: rgb(190, 24, 99);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-style: initial;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="Header">
        Header
    </div>
    <div class="Content">
        Content
    </div>
    <div class="Footer">
        Footer
    </div>

</html>
